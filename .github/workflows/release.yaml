name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: jarcade-windows-x64
            ext: .exe
          - os: ubuntu-latest
            name: jarcade-linux-x64
            ext: ''
          - os: macos-latest
            name: jarcade-macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make gradlew executable
        shell: bash
        run: chmod +x gradlew

      - name: Build native binary
        shell: bash
        run: ./gradlew nativeCompile --console=plain

      - name: Rename binary
        shell: bash
        run: |
          mv "build/native/nativeCompile/jarcade${{ matrix.ext }}" \
             "build/native/nativeCompile/${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/native/nativeCompile/${{ matrix.name }}*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/native/nativeCompile/${{ matrix.name }}*

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble platform packages
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/jarcade-windows-x64/jarcade-windows-x64.exe npm/jarcade-win32-x64/jarcade.exe
          cp artifacts/jarcade-linux-x64/jarcade-linux-x64       npm/jarcade-linux-x64/jarcade
          cp artifacts/jarcade-macos-arm64/jarcade-macos-arm64   npm/jarcade-darwin-arm64/jarcade
          chmod +x npm/jarcade-linux-x64/jarcade npm/jarcade-darwin-arm64/jarcade

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing jarcade@$VERSION to npm"
          for d in npm/jarcade-win32-x64 npm/jarcade-linux-x64 npm/jarcade-darwin-arm64 npm/jarcade; do
            (cd "$d" && npm pkg set version="$VERSION")
          done
          for p in jarcade-win32-x64 jarcade-linux-x64 jarcade-darwin-arm64; do
            (cd npm/jarcade && npm pkg set "optionalDependencies.$p=$VERSION")
          done

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Platform packages first, then the wrapper that depends on them.
          for d in npm/jarcade-win32-x64 npm/jarcade-linux-x64 npm/jarcade-darwin-arm64 npm/jarcade; do
            echo "::group::npm publish $d"
            (cd "$d" && npm publish --access public --provenance)
            echo "::endgroup::"
          done
